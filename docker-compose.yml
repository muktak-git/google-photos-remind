version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remind-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-local}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - SQLITE_DB_PATH=/app/data/db/remind.db
      - PHOTO_DIR=/app/data/photos
      - MAX_CANDIDATES=${MAX_CANDIDATES:-20}
      - MAX_REFINEMENT_TURNS=${MAX_REFINEMENT_TURNS:-5}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: remind-frontend
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19006:19006"
    environment:
      - EXPO_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
